# ---------------------------------------------------------------
# Your job-search profile. Edit this file, commit, and the next
# daily run uses it. No code changes needed.
# ---------------------------------------------------------------

# Search queries sent to the job APIs (one API call per query per source).
# Keep this list short: free tiers have monthly request limits.
queries:
  - "Azure DevOps Engineer"          # also finds Senior Azure DevOps Engineer
  - "Azure Cloud Engineer"
  - "DevSecOps Engineer"
  - "Site Reliability Engineer"
  - "Platform Engineer"
  - "Azure Cloud Architect"          # also finds Cloud Architect / Cloud Infrastructure Architect
  - "Kubernetes Administrator"
# Quota: JSearch free plan = 200 calls a month. 7 queries x 1 call, every 2 days
# (see .github/workflows/daily-jobs.yml) = about 112 calls a month.

# Only show jobs listed on these job sites (matched against the job's publisher and
# its other apply links; the Apply link points to that site). Remove the list to allow all sites.
allowed_sources:
  - "linkedin"
  - "naukri"

# Only show these roles: the job title must contain one of these phrases.
allowed_titles:
  - "devops engineer"                # Azure DevOps Engineer, Senior Azure DevOps Engineer
  - "devsecops"
  - "cloud engineer"                 # Azure Cloud Engineer
  - "site reliability"
  - "sre"
  - "platform engineer"
  - "cloud architect"
  - "cloud infrastructure architect"
  - "kubernetes administrator"
  - "kubernetes admin"

# Experience the job asks for, read from the description ("5+ years", "5-8 years",
# "minimum 5 years"). A job is kept only if your experience falls inside its range:
#   5+, 4+, 5-8, 3-6 years -> kept      2-4, 6+, 8-12, 12+ years -> hidden
experience_filter:
  enabled: true
  my_years: 5.6
  keep_not_stated: true    # keep jobs that do not mention years of experience

# Locations (India). Used by Adzuna "where" and appended to JSearch queries.
# Quota: JSearch = 1 call per query per day; Adzuna = 1 call per query per location per day.
# 4 queries x 1 location = 4 + 4 calls a day (about 120 + 120 a month).
locations:
  - "Hyderabad"
include_remote: true

country: "in"          # ISO country code for both APIs
pages_per_query: 1     # each JSearch call returns up to 10 jobs; 2 = up to 20 per query (costs 2 calls)
max_days_old: 3        # every run checks jobs posted in the last 3 days only.
                       # The Issue lists only jobs you have not been sent before; the downloadable
                       # job list shows all of them, with NEW on the ones not in an earlier run.

# Scoring --------------------------------------------------------
# Each skill found in the title/description adds its weight.
# Weighted to the resume: Azure, AKS, Terraform/OpenTofu, Bicep, Azure DevOps first.
skills:
  azure: 3
  aks: 3
  terraform: 3
  bicep: 3
  "azure devops": 3
  kubernetes: 2
  opentofu: 2
  helm: 2
  "github actions": 2
  "ci/cd": 2
  splunk: 2
  docker: 1
  jenkins: 1
  gitlab: 1
  ansible: 1
  prometheus: 1
  grafana: 1
  "azure monitor": 1
  "key vault": 1
  python: 1
  devsecops: 1
  trivy: 1
  sonarqube: 1

# Bonus points if these appear in the TITLE.
title_bonus:
  azure: 3
  devsecops: 4
  architect: 2
  kubernetes: 2
  devops: 4
  sre: 4
  "site reliability": 4
  platform: 3
  cloud: 2
  "lead": 2
  "senior": 2

# Skill match % --------------------------------------------------
# For each job: of the technologies it mentions, what percent are in `skills` above.
# Example: a job mentions Azure, AKS, Terraform and AWS -> 3 of 4 are yours -> 75%.
min_skill_match: 75    # percent; jobs below this are hidden. 0 turns the filter off.

# Technologies you do NOT list as skills. They only count toward a job's total
# (the "other skills it asks for" column); add or remove freely.
other_tech:
  - aws
  - eks
  - ecs
  - lambda
  - cloudformation
  - cdk
  - gcp
  - "google cloud"
  - gke
  - openshift
  - pulumi
  - chef
  - puppet
  - java
  - "spring boot"
  - ".net"
  - "c#"
  - "node.js"
  - react
  - angular
  - golang
  - kafka
  - spark
  - databricks
  - snowflake
  - hadoop
  - mongodb
  - elasticsearch
  - datadog
  - "new relic"
  - dynatrace
  - cloudwatch
  - vmware
  - salesforce
  - sap

# Jobs whose title contains any of these are dropped.
exclude_title:
  - "intern"
  - "fresher"
  - "trainee"
  - "junior"
  - "sales"
  - "manual test"

# Jobs whose description contains any of these are dropped.
exclude_description: []

min_score: 8           # drop anything scoring below this
max_results: 30        # cap on jobs listed in the daily report

# Optional: AI re-ranking with Claude (only runs if ANTHROPIC_API_KEY secret is set)
ai_summary:
  enabled: true
  top_n: 15            # how many of the best keyword matches to send to Claude
  model: "claude-haiku-4-5"
  resume_summary: |
    DevOps & Cloud Engineer with 5.6+ years on Microsoft Azure (Impressico Business
    Solutions since Jan 2025; Infosys 2021-2024). Azure Kubernetes Service (node pools,
    autoscaling, zero-downtime upgrades), Terraform/OpenTofu and Bicep, Azure DevOps,
    GitHub Actions, GitLab CI and Jenkins pipelines with SonarQube/Trivy/Checkov gates,
    Azure Monitor/Log Analytics/KQL, Prometheus/Grafana and Splunk, Key Vault, Managed
    Identity, RBAC, Python and Bash. Certified AZ-400, AZ-104, AZ-900.
    Looking for Senior / Lead DevOps, SRE, Platform or Cloud Infrastructure roles in
    Hyderabad or remote. Notice period: 30 days.
